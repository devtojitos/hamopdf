name: hamopdf
description: "A simple, fast, cross-platform personal PDF reader."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdfrx: ^1.0.0
  file_picker: ^8.0.0
  docx_to_text: ^1.0.1
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  archive: ^3.6.1
  xml: ^6.5.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
flutter:
  uses-material-design: true
